<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #f4f4f4; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        .area-box { border: 1px solid #999; padding: 10px; margin-bottom: 20px; background: #f9f9f9; }
        .link-list { margin: 10px 0; font-size: 1.2em; }
        .link-list a { margin-right: 20px; text-decoration: underline; color: blue; }
    </style>
</head>
<body>

    <h1>就活メモ</h1>

    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table>
    <h2>■ 終わった企業</h2>
    <table id="table-owari"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table>
    <h2>■ やめた企業</h2>
    <table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table>

    <div class="area-box">
        <h2>■ 提出書類 同期</h2>
        <div class="link-list">
            <a href="https://www.atgp.jp/" target="_blank">atGP</a>
            <a href="https://clover-navi.jp/" target="_blank">クローバーナビ</a>
            <a href="https://doda.jp/challenge/" target="_blank">dodaチャレンジ</a>
            <a href="https://www.hellowork.mhlw.go.jp/" target="_blank">ハローワーク</a>
        </div>
        <input type="file" id="pdfUploadAll">
        <button onclick="alert('アップロード機能を実装します')">📤 アップロード</button>
    </div>

    <div class="area-box">
        <h2>■ 追記メモ</h2>
        <textarea id="additional_memo" placeholder="ここに自由記述のメモを記載"></textarea>
    </div>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';

        async function loadJobs() {
            const res = await fetch(`${API_URL}/api/jobs`);
            const jobs = await res.json();
            ['table-kento', 'table-owari', 'table-yameta'].forEach(id => document.querySelector(`#${id} tbody`).innerHTML = '');
            jobs.forEach(job => {
                const targetId = job.status === '終わった企業' ? 'table-owari' : job.status === 'やめた企業' ? 'table-yameta' : 'table-kento';
                document.querySelector(`#${targetId} tbody`).innerHTML += `<tr><td>${job.id}</td><td>${job.company_name}</td><td>${job.closest_station}</td><td>${job.memo}</td><td><button onclick="deleteJob(${job.id})">削除</button></td></tr>`;
            });
        }

        async function handleSubmit() {
            const data = { 
                company_name: document.getElementById('company_name').value, 
                closest_station: document.getElementById('closest_station').value, 
                memo: document.getElementById('memo').value, 
                status: document.getElementById('status_select').value 
            };
            await fetch(`${API_URL}/api/jobs`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            loadJobs();
        }

        async function deleteJob(id) { await fetch(`${API_URL}/api/jobs/${id}`, { method: 'DELETE' }); loadJobs(); }
        loadJobs();
    </script>
</body>
</html>
