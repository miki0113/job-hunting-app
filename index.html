<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .form-section { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; display: block; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <h1>就活メモ</h1>
    <div class="form-section">
        <input type="text" id="company_name" placeholder="企業名">
        <input type="text" id="closest_station" placeholder="最寄り駅"><br>
        <textarea id="memo" placeholder="メモ（URLを貼ると全てリンクになります）"></textarea>
        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
        </select>
        <button onclick="handleSubmit()">＋ 追加</button>
    </div>

    <table id="job-table">
        <thead><tr><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';

        // 以前のハイパーリンク機能を復旧：全てのURLをリンクに変換する
        function formatMemoDisplay(text) {
            if (!text) return "";
            // 改行を維持しつつ、URLをすべて正規表現でリンクに変換
            return text.replace(/\n/g, '<br>')
                       .replace(/(https?:\/\/[^\s<]+)/g, '<br><a href="$1" target="_blank">$1</a>');
        }

        async function loadJobs() {
            const res = await fetch(`${API_URL}/api/jobs`);
            const jobs = await res.json();
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            jobs.forEach(job => {
                tbody.innerHTML += `<tr>
                    <td>${job.company_name}</td>
                    <td>${job.closest_station}</td>
                    <td>${formatMemoDisplay(job.memo)}</td>
                    <td><button onclick="deleteJob(${job.id})">削除</button></td>
                </tr>`;
            });
        }

        async function handleSubmit() {
            const data = {
                company_name: document.getElementById('company_name').value,
                closest_station: document.getElementById('closest_station').value,
                memo: document.getElementById('memo').value,
                status: document.getElementById('status_select').value
            };
            const res = await fetch(`${API_URL}/api/jobs`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (res.ok) { loadJobs(); } else { alert('保存に失敗しました'); }
        }

        async function deleteJob(id) {
            await fetch(`${API_URL}/api/jobs/${id}`, { method: 'DELETE' });
            loadJobs();
        }
        loadJobs();
    </script>
</body>
</html>
