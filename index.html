<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 10px; background-color: #f5f5f5; }
        .container { max-width: 800px; margin: auto; background: white; padding: 15px; border-radius: 8px; }
        .form-section { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        .button-row { display: flex; align-items: center; gap: 2px; margin-top: 5px; flex-wrap: wrap; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; min-width: 500px; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 4px; font-size: 14px; }
        th { background: #eee; }
        .sync-section { border: 1px solid #ccc; padding: 10px; text-align: center; }
        .sync-buttons { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>就活メモ</h1>
    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        <div class="button-row">
            <button onclick="document.getElementById('topFile').click()">ファイルの選択</button>
            <input type="file" id="topFile" style="display:none">
            <button onclick="uploadFile()">📥 アップロード</button>
        </div>
        <div class="button-row">
            <select id="table-selector"><option value="kento">検討中</option><option value="yameta">やめた</option><option value="owatta">終了</option></select>
            <button onclick="addTableData()">＋ 追加</button>
        </div>
    </div>
    <h2>■ 検討中の企業</h2>
    <div class="table-wrapper"><table id="table-kento"><thead><tr><th>番</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
    <h2>■ 終わった企業</h2>
    <div class="table-wrapper"><table id="table-owatta"><thead><tr><th>番</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
    <h2>■ やめた企業</h2>
    <div class="table-wrapper"><table id="table-yameta"><thead><tr><th>番</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
    <h3>■ 追記メモ</h3>
    <textarea id="additional_memo"></textarea>
    <div class="sync-section">
        <h3>提出書類 同期</h3>
        <div class="sync-buttons">
            <select id="file-select"><option value="">-- ファイル --</option></select>
            <button onclick="downloadFile()">ダウンロード</button>
            <button onclick="deleteFile()" style="color:red">削除</button>
        </div>
    </div>
</div>
<script>
    async function loadData() {
        const res = await fetch('/api/data');
        const data = await res.json();
        document.getElementById('additional_memo').value = data.memo || '';
        ['kento', 'owatta', 'yameta'].forEach(t => {
            document.querySelector(`#table-${t} tbody`).innerHTML = (data[t] || []).map((item, i) => 
                `<tr><td>${i+1}</td><td>${item.n}</td><td>${item.s}</td><td>${item.m}</td></tr>`).join('');
        });
        updateFileList();
    }
    async function saveData() {
        const data = {
            memo: document.getElementById('additional_memo').value,
            kento: getTable('kento'), owatta: getTable('owatta'), yameta: getTable('yameta')
        };
        await fetch('/api/data', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
    }
    function getTable(id) {
        return Array.from(document.querySelectorAll(`#table-${id} tbody tr`)).map(tr => ({ n: tr.cells[1].textContent, s: tr.cells[2].textContent, m: tr.cells[3].textContent }));
    }
    function addTableData() {
        const t = document.getElementById('table-selector').value;
        const tbody = document.querySelector(`#table-${t} tbody`);
        tbody.innerHTML += `<tr><td>${tbody.rows.length+1}</td><td>${document.getElementById('company_name').value}</td><td>${document.getElementById('closest_station').value}</td><td>${document.getElementById('memo').value}</td></tr>`;
        saveData();
    }
    async function uploadFile() {
        const f = document.getElementById('topFile').files[0];
        if (!f) return;
        const fd = new FormData(); fd.append('file', f);
        await fetch('/api/upload', { method: 'POST', body: fd });
        updateFileList();
    }
    async function updateFileList() {
        const res = await fetch('/api/files');
        const files = await res.json();
        const sel = document.getElementById('file-select');
        sel.innerHTML = '<option value="">選択</option>' + files.map(f => `<option value="${f}">${f}</option>`).join('');
    }
    function downloadFile() { window.open('/uploads/' + document.getElementById('file-select').value); }
    async function deleteFile() {
        await fetch('/api/upload/' + document.getElementById('file-select').value, { method: 'DELETE' });
        updateFileList();
    }
    document.getElementById('additional_memo').addEventListener('input', saveData);
    loadData();
</script>
</body>
</html>
