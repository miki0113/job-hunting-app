<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .form-section { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h1>就活メモ</h1>
    <div class="form-section">
        <input type="text" id="company_name" placeholder="企業名">
        <input type="text" id="closest_station" placeholder="最寄り駅">
        <textarea id="memo" placeholder="メモ（自由に改行、URL入力可）" style="width:100%; height:80px; display:block;"></textarea>
        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody id="table-kento"></tbody></table>

    <h2>■ 終わった企業</h2>
    <table><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody id="table-owari"></tbody></table>

    <h2>■ やめた企業</h2>
    <table><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody id="table-yameta"></tbody></table>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';
        
        async function loadJobs() {
            const res = await fetch(`${API_URL}/api/jobs`);
            const jobs = await res.json();
            const containers = { '検討中の企業': 'table-kento', '終わった企業': 'table-owari', 'やめた企業': 'table-yameta' };
            Object.values(containers).forEach(id => document.getElementById(id).innerHTML = '');
            
            jobs.forEach(job => {
                const tbody = document.getElementById(containers[job.status]);
                // 入力された改行を保持し、URLを自動的にリンクへ変換
                const memoContent = (job.memo || '').split('\n').map(line => {
                    return line.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
                }).join('<br>');

                tbody.innerHTML += `<tr><td>${job.id}</td><td>${job.company_name}</td><td>${job.closest_station || ''}</td><td>${memoContent}</td><td><button onclick="deleteJob('${job.id}')">削除</button></td></tr>`;
            });
        }

        async function handleSubmit() {
            const data = {
                company_name: document.getElementById('company_name').value,
                closest_station: document.getElementById('closest_station').value,
                memo: document.getElementById('memo').value,
                status: document.getElementById('status_select').value
            };
            const res = await fetch(`${API_URL}/api/jobs`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) { 
                document.getElementById('company_name').value = '';
                document.getElementById('closest_station').value = '';
                document.getElementById('memo').value = '';
                loadJobs(); 
            } else { alert('保存に失敗しました。'); }
        }

        async function deleteJob(id) {
            await fetch(`${API_URL}/api/jobs/${id}`, { method: 'DELETE' });
            loadJobs();
        }
        loadJobs();
    </script>
</body>
</html>
