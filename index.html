<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 20px; 
            background-color: #f5f5f5; 
        }
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
        }
        .form-section { 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin-bottom: 20px; 
        }
        textarea { 
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 5px; 
            min-height: 80px; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 30px; 
        }
        th, td { 
            border: 1px solid #ccc; 
            padding: 10px; 
            text-align: left; 
        }
        th { 
            background: #eee; 
        }
        .row-selected { 
            background-color: #d1e7dd !important; 
        }
        .action-bar { 
            margin: 10px 0; 
            padding: 10px; 
            background: #e9ecef; 
            border-radius: 5px; 
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>就活メモ</h1>

        <div class="action-bar">
            <select id="action-selector">
                <option value="owatta">「終わった」へ移動</option>
                <option value="yameta">「やめた」へ移動</option>
                <option value="kento">「検討中」へ戻す</option>
            </select>
            <button onclick="executeMove()">移動実行</button>
            <button onclick="executeDelete()" style="color:red;">選択した行を削除</button>
        </div>

        <div class="form-section">
            <textarea id="company_name" placeholder="企業名"></textarea>
            <textarea id="closest_station" placeholder="最寄り駅"></textarea>
            <textarea id="memo" placeholder="メモ"></textarea>
            
            <input type="hidden" id="edit_type" value="">
            <input type="hidden" id="edit_index" value="">
            
            <select id="table-selector">
                <option value="kento">検討中の企業</option>
                <option value="yameta">やめた企業</option>
                <option value="owatta">終わった企業</option>
            </select>
            <button onclick="handleSubmit()">データを追加/更新</button>
        </div>

        <h2>■ 企業リスト</h2>
        <h3>検討中</h3>
        <table id="table-kento">
            <thead>
                <tr>
                    <th>番号</th>
                    <th>企業名</th>
                    <th>最寄り</th>
                    <th>メモ</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h3>終わった</h3>
        <table id="table-owatta">
            <thead>
                <tr>
                    <th>番号</th>
                    <th>企業名</th>
                    <th>最寄り</th>
                    <th>メモ</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h3>やめた</h3>
        <table id="table-yameta">
            <thead>
                <tr>
                    <th>番号</th>
                    <th>企業名</th>
                    <th>最寄り</th>
                    <th>メモ</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        var selectedRow = { type: null, index: null };

        function selectRow(type, index, element) {
            var rows = document.getElementsByTagName('tr');
            for (var i = 0; i < rows.length; i++) {
                rows[i].classList.remove('row-selected');
            }
            element.classList.add('row-selected');
            selectedRow.type = type;
            selectedRow.index = index;
        }

        function loadAllData() {
            fetch('/api/data')
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                var types = ['kento', 'owatta', 'yameta'];
                
                for (var i = 0; i < types.length; i++) {
                    var type = types[i];
                    var tbody = document.querySelector('#table-' + type + ' tbody');
                    var items = data[type] || [];
                    
                    tbody.innerHTML = '';
                    
                    for (var j = 0; j < items.length; j++) {
                        var item = items[j];
                        var row = document.createElement('tr');
                        
                        row.onclick = (function(t, idx, el) {
                            return function() {
                                selectRow(t, idx, el);
                                loadToEdit(t, idx);
                            };
                        })(type, j, row);
                        
                        var numCell = document.createElement('td');
                        numCell.innerText = j + 1;
                        row.appendChild(numCell);
                        
                        var nameCell = document.createElement('td');
                        nameCell.innerHTML = item.name || '';
                        row.appendChild(nameCell);
                        
                        var stationCell = document.createElement('td');
                        stationCell.innerText = item.station || '';
                        row.appendChild(stationCell);
                        
                        var memoCell = document.createElement('td');
                        memoCell.innerHTML = item.memo || '';
                        row.appendChild(memoCell);
                        
                        tbody.appendChild(row);
                    }
                }
            });
        }

        function loadToEdit(type, index) {
            fetch('/api/data')
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                var item = data[type][index];
                
                document.getElementById('company_name').value = item.name;
                document.getElementById('closest_station').value = item.station;
                document.getElementById('memo').value = item.memo;
                
                document.getElementById('edit_type').value = type;
                document.getElementById('edit_index').value = index;
            });
        }

        function executeMove() {
            if (selectedRow.type === null) {
                alert('行を選択してください');
                return;
            }
            var target = document.getElementById('action-selector').value;
            fetch('/api/data')
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                var item = data[selectedRow.type].splice(selectedRow.index, 1)[0];
                
                if (!data[target]) {
                    data[target] = [];
                }
                data[target].push(item);
                
                saveToApi(data);
            });
        }

        function executeDelete() {
            if (selectedRow.type === null) {
                alert('行を選択してください');
                return;
            }
            if (!confirm('削除しますか？')) {
                return;
            }
            fetch('/api/data')
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                data[selectedRow.type].splice(selectedRow.index, 1);
                
                saveToApi(data);
            });
        }

        function handleSubmit() {
            fetch('/api/data')
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                var type = document.getElementById('table-selector').value;
                var eType = document.getElementById('edit_type').value;
                var eIdx = document.getElementById('edit_index').value;
                
                var newItem = { 
                    name: document.getElementById('company_name').value, 
                    station: document.getElementById('closest_station').value, 
                    memo: document.getElementById('memo').value 
                };
                
                if (eType !== "" && eIdx !== "") {
                    data[eType].splice(eIdx, 1);
                }
                
                if (!data[type]) {
                    data[type] = [];
                }
                data[type].push(newItem);
                
                document.getElementById('edit_type').value = "";
                document.getElementById('edit_index').value = "";
                
                saveToApi(data);
            });
        }

        function saveToApi(data) {
            fetch('/api/data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(function() {
                loadAllData();
                selectedRow = { type: null, index: null };
            });
        }

        window.onload = loadAllData;
    </script>
</body>
</html>
