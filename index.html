<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #f4f4f4; }
        textarea { width: 100%; box-sizing: border-box; }
        .area-box { border: 1px solid #999; padding: 10px; margin-bottom: 20px; background: #f9f9f9; }
    </style>
</head>
<body>

    <h1>就活メモ</h1>

    <div class="form-section">
        <textarea id="company_name" placeholder="企業名（[表示名](URL)形式でリンク化）"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <h2>■ 終わった企業</h2>
    <table id="table-owari"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <h2>■ やめた企業</h2>
    <table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <div class="area-box" style="text-align: center;">
        <a href="https://www.atgp.jp/" target="_blank">atGP</a>&nbsp;&nbsp;
        <a href="https://clover-navi.jp/" target="_blank">クローバーナビ</a>&nbsp;&nbsp;
        <a href="https://doda.jp/" target="_blank">dodaチャレンジ</a>&nbsp;&nbsp;
        <a href="https://www.hellowork.mhlw.go.jp/" target="_blank">ハローワーク</a>
    </div>

    <div class="area-box">
        <h2>■ 追記メモ</h2>
        <textarea id="additional_memo" placeholder="ここに自由記述のメモを記載"></textarea>
    </div>

    <div class="area-box" style="text-align: center;">
        <h2>■ 提出書類 同期（履歴書・職務経歴書など全形式対応）</h2>
        <input type="file" id="pdfUpload">
        <button onclick="handleFileUpload()">アップロード</button>
        <br><br>
        <select id="fileSelect">
            <option>-- 保存済みファイルを選択 --</option>
        </select>
        <button onclick="handleDownload()">ダウンロード/表示</button>
        <button onclick="handleDeleteFile()" style="color:red;">削除</button>
    </div>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';

        function parseMarkdownLinks(text) {
            if (!text) return "";
            return text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>').replace(/\n/g, '<br>');
        }

        async function loadJobs() {
            const res = await fetch(`${API_URL}/api/jobs`);
            const jobs = await res.json();
            ['table-kento', 'table-owari', 'table-yameta'].forEach(id => document.querySelector(`#${id} tbody`).innerHTML = '');
            
            jobs.forEach(job => {
                const targetId = job.status === '終わった企業' ? 'table-owari' : job.status === 'やめた企業' ? 'table-yameta' : 'table-kento';
                const tbody = document.querySelector(`#${targetId} tbody`);
                
                let moveBtns = '';
                if (job.status !== '検討中の企業') moveBtns += `<button onclick="moveJob(${job.id}, '検討中の企業')">検討</button>`;
                if (job.status !== '終わった企業') moveBtns += `<button onclick="moveJob(${job.id}, '終わった企業')">終了</button>`;
                if (job.status !== 'やめた企業') moveBtns += `<button onclick="moveJob(${job.id}, 'やめた企業')">中止</button>`;

                tbody.innerHTML += `<tr><td>${job.id}</td><td>${parseMarkdownLinks(job.company_name)}</td><td>${parseMarkdownLinks(job.closest_station)}</td><td>${parseMarkdownLinks(job.memo)}</td><td>${moveBtns}</td><td><button onclick="deleteJob(${job.id})">削除</button></td></tr>`;
            });
        }

        async function handleSubmit() {
            const data = { 
                company_name: document.getElementById('company_name').value, 
                closest_station: document.getElementById('closest_station').value, 
                memo: document.getElementById('memo').value, 
                status: document.getElementById('status_select').value 
            };
            const res = await fetch(`${API_URL}/api/jobs`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if (res.ok) loadJobs();
        }

        async function deleteJob(id) {
            await fetch(`${API_URL}/api/jobs/${id}`, { method: 'DELETE' });
            loadJobs();
        }

        async function moveJob(id, newStatus) {
            await fetch(`${API_URL}/api/jobs/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: newStatus }) });
            loadJobs();
        }

        function handleFileUpload() { alert('アップロード処理を接続してください'); }
        function handleDownload() { alert('ダウンロード処理を接続してください'); }
        function handleDeleteFile() { alert('削除処理を接続してください'); }

        loadJobs();
    </script>
</body>
</html>
