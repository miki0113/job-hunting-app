<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #f4f4f4; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .area-box { border: 1px solid #999; padding: 10px; margin-bottom: 20px; background: #f9f9f9; text-align: center; }
    </style>
</head>
<body>

    <h1>就活メモ</h1>

    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ（改行OK）"></textarea>
        
        <input type="file" id="topFile"><br>
        <button onclick="uploadTopFile()">📤 アップロード</button><br>
        <button onclick="insertTopLink()">選択テキストをリンク化</button><br>

        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <h2>■ 終わった企業</h2>
    <table id="table-owari"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <h2>■ やめた企業</h2>
    <table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <div class="area-box" style="text-align: left;">
        <h2>■ 追記メモ</h2>
        <textarea id="additional_memo" placeholder="ここに自由記述のメモを記載"></textarea>
    </div>

    <div class="area-box">
        <h2>■ 提出書類 同期</h2>
        <input type="file" id="pdfUploadAll"><br>
        <button onclick="handleFileUploadAll()">📤 アップロード</button><br>
        <select id="fileSelect">
            <option>-- 保存済みファイルを選択 --</option>
        </select><br>
        <button onclick="handleDownload()">📥 ダウンロード/表示</button><br>
        <button onclick="handleDeleteFile()" style="color:red;">🗑️ 削除</button>
    </div>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';
        let topUploadedUrl = "";

        async function uploadTopFile() {
            const fileInput = document.getElementById('topFile');
            if (!fileInput.files[0]) { alert('ファイルを選択してください'); return; }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            try {
                const res = await fetch(`${API_URL}/api/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                // サーバーが返すデータのプロパティ名を確認（通常は data.url または data.fileUrl）
                topUploadedUrl = data.url || data.fileUrl || data; 
                alert('アップロード完了！URL: ' + topUploadedUrl);
            } catch (err) {
                alert('アップロード失敗: ' + err.message);
            }
        }

        function insertTopLink() {
            if (!topUploadedUrl) { alert('先にPDFをアップロードしてください'); return; }
            const field = document.activeElement.tagName === 'TEXTAREA' ? document.activeElement : document.getElementById('memo');
            const start = field.selectionStart;
            const end = field.selectionEnd;
            const selectedText = field.value.substring(start, end);
            
            if (selectedText) {
                field.value = field.value.substring(0, start) + `[${selectedText}](${topUploadedUrl})` + field.value.substring(end);
            } else {
                alert('リンク化したい文字を選択してください。');
            }
        }

        async function handleFileUploadAll() { alert('同期用サーバーへアップロード'); }
        function handleDownload() { alert('ダウンロード実行'); }
        function handleDeleteFile() { alert('削除実行'); }

        // 省略（表示ロジックは以前の動作するものを維持）
        function parseMarkdownLinks(text) { return text ? text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>').replace(/\n/g, '<br>') : ""; }
        async function loadJobs() {
            const res = await fetch(`${API_URL}/api/jobs`);
            const jobs = await res.json();
            ['table-kento', 'table-owari', 'table-yameta'].forEach(id => document.querySelector(`#${id} tbody`).innerHTML = '');
            jobs.forEach(job => {
                const targetId = job.status === '終わった企業' ? 'table-owari' : job.status === 'やめた企業' ? 'table-yameta' : 'table-kento';
                const tbody = document.querySelector(`#${targetId} tbody`);
                tbody.innerHTML += `<tr><td>${job.id}</td><td>${parseMarkdownLinks(job.company_name)}</td><td>${parseMarkdownLinks(job.closest_station)}</td><td>${parseMarkdownLinks(job.memo)}</td><td></td><td><button onclick="deleteJob(${job.id})">削除</button></td></tr>`;
            });
        }
        async function handleSubmit() {
            const data = { company_name: document.getElementById('company_name').value, closest_station: document.getElementById('closest_station').value, memo: document.getElementById('memo').value, status: document.getElementById('status_select').value };
            await fetch(`${API_URL}/api/jobs`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            loadJobs();
        }
        async function deleteJob(id) { await fetch(`${API_URL}/api/jobs/${id}`, { method: 'DELETE' }); loadJobs(); }
        loadJobs();
    </script>
</body>
</html>
