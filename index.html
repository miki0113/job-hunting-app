<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 20px; 
            background-color: #f5f5f5; 
        }
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
        }
        .form-section { 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin-bottom: 20px; 
        }
        textarea { 
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 5px; 
            min-height: 80px; 
        }
        .table-wrapper { 
            width: 100%; 
            overflow-x: auto; 
            margin-bottom: 30px; 
        }
        table { 
            width: 100%; 
            min-width: 800px; 
            border-collapse: collapse; 
        }
        th, td { 
            border: 1px solid #ccc; 
            padding: 8px; 
            text-align: left; 
            background: #f9f9f9; 
            vertical-align: top; 
        }
        th { 
            background: #eee; 
        }
        .btn-action { 
            font-size: 11px; 
            padding: 3px 6px; 
            cursor: pointer; 
            margin: 1px; 
        }
        .btn-delete { 
            background-color: #ffcccc; 
            color: #cc0000; 
        }
        .button-row { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            margin-top: 5px; 
        }
        .editable { 
            cursor: pointer; 
            border-bottom: 1px dashed #999; 
        }
        .memo-section { 
            border: 1px dashed #bbb; 
            padding: 15px; 
            margin-bottom: 30px; 
            border-radius: 4px; 
        }
        #status-msg { 
            color: #cc0000; 
            font-weight: bold; 
            margin: 10px 0; 
            text-align: center; 
            height: 20px; 
        }
        .file-info-text { 
            font-size: 12px; 
            color: #555; 
            margin-left: 10px; 
        }
        /* 追加したUI用スタイル */
        .bulk-action-bar { 
            border: 1px solid #999; 
            padding: 10px; 
            margin-bottom: 20px; 
            background: #f0f0f0; 
        }
        .row-selected { background-color: #fff9c4 !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>就活メモ</h1>
        <div id="status-msg"></div>

        <div class="bulk-action-bar">
            <strong>選択した行の操作:</strong>
            <select id="bulk-target-selector">
                <option value="kento">検討中へ移動</option>
                <option value="owatta">終わったへ移動</option>
                <option value="yameta">やめたへ移動</option>
            </select>
            <button onclick="executeBulkMove()">移動実行</button>
        </div>

        <div class="form-section">
            <textarea id="company_name" placeholder="企業名" onfocus="lastFocused=this"></textarea>
            <textarea id="closest_station" placeholder="最寄り駅" onfocus="lastFocused=this"></textarea>
            <textarea id="memo" placeholder="メモ" onfocus="lastFocused=this"></textarea>
            
            <input type="hidden" id="edit_type" value="">
            <input type="hidden" id="edit_index" value="">

            <div class="button-row">
                <select id="link-file-selector" onchange="updateFileInfo('link-file-selector', 'company-info')">
                    <option>-- 企業ファイル選択 --</option>
                </select>
                <span id="company-info" class="file-info-text">選択なし</span>
                <button onclick="insertSelectedTextLink()">🔗 リンク化</button>
                <button class="btn-delete" onclick="deleteFile('link-file-selector')">🗑 削除</button>
            </div>
            
            <div class="button-row">
                <input type="file" id="fileInput" style="display:none" onchange="updateFileNameDisplay(this)">
                <button onclick="document.getElementById('fileInput').click()">ファイル選択</button>
                <span id="file-name-display" style="font-size: 12px; color: #666;">選択されていません</span>
                <button onclick="uploadFile()">📥 アップロード</button>
            </div>
            
            <div class="button-row">
                <select id="table-selector">
                    <option value="kento">検討中の企業</option>
                    <option value="yameta">やめた企業</option>
                    <option value="owatta">終わった企業</option>
                </select>
                <button onclick="handleSubmit()">＋ データを追加/更新</button>
            </div>
        </div>

        <h2>■ 企業リスト</h2>
        <h3>検討中</h3>
        <div class="table-wrapper"><table id="table-kento"><thead><tr><th>選択</th><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        <h3>終わった</h3>
        <div class="table-wrapper"><table id="table-owatta"><thead><tr><th>選択</th><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        <h3>やめた</h3>
        <div class="table-wrapper"><table id="table-yameta"><thead><tr><th>選択</th><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table></div>

        <div class="memo-section">
            <h3>■ 追記メモ</h3>
            <textarea id="additional_memo" oninput="saveAdditionalMemo()"></textarea>
        </div>
    </div>

    <script>
        var lastFocused = document.getElementById('company_name');

        function updateFileNameDisplay(input) {
            var display = document.getElementById('file-name-display');
            display.innerText = input.files[0] ? input.files[0].name : '選択されていません';
        }

        function showStatus(msg, isError) {
            var el = document.getElementById('status-msg');
            el.style.color = isError ? 'red' : 'green';
            el.innerText = msg;
            setTimeout(function() { el.innerText = ''; }, 3000);
        }

        function updateFileInfo(selectId, infoId) {
            var sel = document.getElementById(selectId);
            var info = document.getElementById(infoId);
            info.innerText = sel.selectedIndex > 0 ? "選択中: " + sel.options[sel.selectedIndex].text : "選択なし";
        }

        // --- 追加：一括操作用 ---
        function executeBulkMove() {
            var checked = document.querySelectorAll('.row-checkbox:checked');
            if (checked.length === 0) { alert('行を選択してください'); return; }
            var target = document.getElementById('bulk-target-selector').value;
            fetch('/api/data').then(res => res.json()).then(data => {
                checked.forEach(cb => {
                    var t = cb.getAttribute('data-type');
                    var idx = parseInt(cb.getAttribute('data-index'));
                    var item = data[t].splice(idx, 1)[0];
                    if (!data[target]) data[target] = [];
                    data[target].push(item);
                });
                saveToApi(data);
            });
        }

        function loadAllData() {
            fetch('/api/data')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                document.getElementById('additional_memo').value = data.additional || '';
                var types = ['kento', 'owatta', 'yameta'];
                for (var i = 0; i < types.length; i++) {
                    var type = types[i];
                    var tbody = document.querySelector('#table-' + type + ' tbody');
                    var items = data[type] || [];
                    tbody.innerHTML = '';
                    for (var j = 0; j < items.length; j++) {
                        var item = items[j];
                        var row = document.createElement('tr');
                        
                        // チェックボックス追加
                        var chkCell = document.createElement('td');
                        var chk = document.createElement('input');
                        chk.type = 'checkbox'; chk.className = 'row-checkbox';
                        chk.setAttribute('data-type', type); chk.setAttribute('data-index', j);
                        chkCell.appendChild(chk); row.appendChild(chkCell);

                        var numCell = document.createElement('td'); numCell.innerText = j + 1; row.appendChild(numCell);
                        var nameCell = document.createElement('td'); nameCell.className = 'editable'; nameCell.innerHTML = item.name || ''; nameCell.onclick = function(t, idx) { return function() { loadToEdit(t, idx); }; }(type, j); row.appendChild(nameCell);
                        var stationCell = document.createElement('td'); stationCell.innerText = item.station || ''; row.appendChild(stationCell);
                        var memoCell = document.createElement('td'); memoCell.innerHTML = item.memo || ''; row.appendChild(memoCell);
                        
                        // 元々の操作ボタン
                        var actionCell = document.createElement('td');
                        var delBtn = document.createElement('button'); delBtn.className = 'btn-action btn-delete'; delBtn.innerText = '削除'; delBtn.onclick = function(t, idx) { return function() { deleteItem(t, idx); }; }(type, j); actionCell.appendChild(delBtn);
                        if (type === 'kento') {
                            var endBtn = document.createElement('button'); endBtn.className = 'btn-action'; endBtn.innerText = '終わった'; endBtn.onclick = function(t, idx) { return function() { moveItem(t, idx, 'owatta'); }; }(type, j); actionCell.appendChild(endBtn);
                            var stopBtn = document.createElement('button'); stopBtn.className = 'btn-action'; stopBtn.innerText = 'やめた'; stopBtn.onclick = function(t, idx) { return function() { moveItem(t, idx, 'yameta'); }; }(type, j); actionCell.appendChild(stopBtn);
                        }
                        if (type === 'yameta') {
                            var reviveBtn = document.createElement('button'); reviveBtn.className = 'btn-action'; reviveBtn.innerText = '検討中に戻す'; reviveBtn.onclick = function(t, idx) { return function() { moveItem(t, idx, 'kento'); }; }(type, j); actionCell.appendChild(reviveBtn);
                        }
                        row.appendChild(actionCell);
                        tbody.appendChild(row);
                    }
                }
                loadCompanyFiles();
            });
        }

        // --- 既存ロジック ---
        function loadToEdit(type, index) { /* 既存コード */ }
        function handleSubmit() { /* 既存コード */ }
        function loadCompanyFiles() { /* 既存コード */ }
        function uploadFile() { /* 既存コード */ }
        function deleteFile(selId) { /* 既存コード */ }
        function insertSelectedTextLink() { /* 既存コード */ }
        function deleteItem(t, i) { /* 既存コード */ }
        function moveItem(f, i, t) { /* 既存コード */ }
        function saveAdditionalMemo() { /* 既存コード */ }
        function saveToApi(data) { fetch('/api/data', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) }).then(function() { loadAllData(); }); }
        window.onload = loadAllData;
    </script>
</body>
</html>
