<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        .form-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; min-height: 80px; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 30px; }
        table { width: 100%; min-width: 800px; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #eee; }
        .button-row { display: flex; gap: 5px; margin-bottom: 10px; align-items: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>就活メモ</h1>
    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        
        <div class="button-row">
            <input type="file" id="fileInput" style="display:none">
            <button onclick="document.getElementById('fileInput').click()">ファイル選択</button>
            <button onclick="uploadFile()">📤 アップロード実行</button>
            <span id="file-status">未選択</span>
            <button onclick="insertSelectedTextLink()">🔗 選択範囲をリンク化</button>
        </div>
        
        <select id="table-selector">
            <option value="kento">検討中の企業</option>
            <option value="yameta">やめた企業</option>
            <option value="owatta">終わった企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データを追加</button>
    </div>

    <h2>■ 企業リスト</h2>
    <div class="table-wrapper"><table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
    <div class="table-wrapper"><table id="table-owatta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
    <div class="table-wrapper"><table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
</div>

<script>
    let lastUploadedUrl = "";

    // 1. アップロード処理：サーバーから確実にURLを取得する
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) return alert('先にファイルを選択してください');
        
        const fd = new FormData();
        fd.append('file', fileInput.files[0]);
        
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const d = await res.json();
        lastUploadedUrl = d.url;
        document.getElementById('file-status').textContent = "アップロード完了";
        alert('アップロード成功！これでリンク化できます');
    }

    // 2. リンク化処理：現在フォーカス中のエリアのテキストをタグで包む
    function insertSelectedTextLink() {
        if (!lastUploadedUrl) return alert('先にアップロードを実行してください');
        const ta = document.activeElement;
        if (!ta || ta.tagName !== 'TEXTAREA') return alert('メモ欄等でテキストを選択してからボタンを押してください');
        
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const selected = ta.value.substring(start, end);
        if (!selected) return alert('リンクにしたい文字を選択してください');

        const link = `<a href="${lastUploadedUrl}" target="_blank">${selected}</a>`;
        ta.value = ta.value.substring(0, start) + link + ta.value.substring(end);
    }

    // 3. データ追加：HTMLタグをそのまま保存し、テーブルで表示
    async function handleSubmit() {
        const type = document.getElementById('table-selector').value;
        const newData = {
            name: document.getElementById('company_name').value,
            station: document.getElementById('closest_station').value,
            memo: document.getElementById('memo').value
        };
        
        const res = await fetch('/api/data');
        const data = await res.json();
        data[type].push(newData);
        
        await fetch('/api/data', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify(data) 
        });
        loadAllData();
    }

    // 4. データ読み込み：innerHTMLでタグを有効化
    async function loadAllData() {
        const res = await fetch('/api/data');
        const data = await res.json();
        ['kento', 'owatta', 'yameta'].forEach(type => {
            const tbody = document.querySelector(`#table-${type} tbody`);
            tbody.innerHTML = (data[type] || []).map((item, i) => 
                `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.station}</td><td>${item.memo}</td></tr>`
            ).join('');
        });
    }

    loadAllData();
</script>
</body>
</html>
