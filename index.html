<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; min-height: 80px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #eee; }
        .button-row { display: flex; gap: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>就活メモ</h1>
    <textarea id="company_name" placeholder="企業名"></textarea>
    <textarea id="closest_station" placeholder="最寄り駅"></textarea>
    <textarea id="memo" placeholder="メモ"></textarea>
    
    <div class="button-row">
        <button onclick="document.getElementById('topFile').click()">ファイル選択</button>
        <input type="file" id="topFile" style="display:none" onchange="document.getElementById('file-name').textContent = this.files[0].name">
        <button onclick="uploadTopFile()">📤 アップロードしてURL取得</button>
        <span id="file-name"></span>
        <button onclick="insertSelectedTextLink()">🔗 選択範囲をリンク化</button>
    </div>
    
    <select id="table-selector">
        <option value="kento">検討中の企業</option>
        <option value="yameta">やめた企業</option>
        <option value="owatta">終わった企業</option>
    </select>
    <button onclick="handleSubmit()">＋ テーブルに追加</button>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table>
    
    <h2>■ 終わった企業</h2>
    <table id="table-owatta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table>
    
    <h2>■ やめた企業</h2>
    <table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table>
</div>

<script>
    let lastUploadedUrl = "";

    // 1. データを読み込んで表示する関数（ここが重要）
    async function loadAllData() {
        const res = await fetch('/api/data');
        const data = await res.json();
        ['kento', 'owatta', 'yameta'].forEach(type => {
            const tbody = document.querySelector(`#table-${type} tbody`);
            if (data[type]) {
                // innerHTML を使うことでHTMLタグ（リンク）を正しく表示する
                tbody.innerHTML = data[type].map((item, i) => 
                    `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.station}</td><td>${item.memo}</td></tr>`
                ).join('');
            }
        });
    }

    // 2. 選択範囲だけをリンクタグで包む関数
    function insertSelectedTextLink() {
        if (!lastUploadedUrl) return alert('先にファイルをアップロードしてください');
        const ta = document.activeElement;
        if (!ta || ta.tagName !== 'TEXTAREA') return;
        
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const selected = ta.value.substring(start, end);
        if (!selected) return;

        const link = `<a href="${lastUploadedUrl}" target="_blank">${selected}</a>`;
        ta.value = ta.value.substring(0, start) + link + ta.value.substring(end);
    }

    // 3. 追加関数
    async function handleSubmit() {
        const type = document.getElementById('table-selector').value;
        const newData = {
            name: document.getElementById('company_name').value,
            station: document.getElementById('closest_station').value,
            memo: document.getElementById('memo').value
        };
        
        // 既存データを取得して追加
        const res = await fetch('/api/data');
        const data = await res.json();
        data[type].push(newData);
        
        await fetch('/api/data', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify(data) 
        });
        loadAllData();
    }

    async function uploadTopFile() {
        const f = document.getElementById('topFile').files[0];
        const fd = new FormData(); fd.append('file', f);
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const d = await res.json();
        lastUploadedUrl = d.url;
    }

    loadAllData();
</script>
</body>
</html>
