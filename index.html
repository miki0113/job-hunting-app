<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        .form-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; min-height: 50px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .sync-section { border-top: 2px solid #333; padding-top: 20px; margin-top: 40px; text-align: center; }
        .sync-section button, .sync-section select { display: block; width: 200px; margin: 5px auto; }
        #file-input, #topFile { display: none; }
        button { cursor: pointer; padding: 5px 10px; margin: 2px; }
    </style>
</head>
<body>
<div class="container">
    <h1>就活メモ</h1>
    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        <div style="margin-bottom: 10px;">
            <input type="file" id="topFile" onchange="document.getElementById('file-name-display').textContent = this.files[0].name">
            <button onclick="document.getElementById('topFile').click()">ファイルの選択</button>
            <button onclick="uploadTopFile()">📤 アップロード</button>
            <span id="file-name-display" style="margin-left: 10px; font-size: 0.9em; color: #555;"></span>
        </div>
        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <div class="form-section">
        <h3>■ 追記メモ</h3>
        <textarea id="additional_memo" placeholder="ここに自由記述のメモを記載"></textarea>
    </div>

    </div>

<script>
    const API_URL = 'https://job-hunting-app-vy3h.onrender.com';

    // サーバーと通信してメモを初期化
    async function init() {
        const res = await fetch(`${API_URL}/api/memo`);
        const data = await res.json();
        document.getElementById('additional_memo').value = data.content || '';
    }

    // メモ入力時にサーバーへ自動保存
    document.getElementById('additional_memo').addEventListener('input', async (e) => {
        await fetch(`${API_URL}/api/memo`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ content: e.target.value })
        });
    });

    // アップロード関数
    async function uploadTopFile() {
        const fileInput = document.getElementById('topFile');
        const display = document.getElementById('file-name-display');
        if (!fileInput.files[0]) return alert('ファイルが選択されていません');
        display.textContent = 'アップロード中...';
        
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        
        const res = await fetch(`${API_URL}/api/upload`, { method: 'POST', body: formData });
        if (res.ok) {
            display.textContent = '✅ アップロード完了';
            fileInput.value = '';
        } else {
            display.textContent = '❌ アップロード失敗';
        }
    }

    init();
</script>
</body>
</html>
