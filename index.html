<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 20px; 
            background-color: #f5f5f5; 
        }
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
        }
        .form-section { 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin-bottom: 20px; 
        }
        textarea { 
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 5px; 
            min-height: 80px; 
        }
        .table-wrapper { 
            width: 100%; 
            overflow-x: auto; 
            margin-bottom: 5px; 
        }
        table { 
            width: 100%; 
            min-width: 800px; 
            border-collapse: collapse; 
        }
        th, td { 
            border: 1px solid #ccc; 
            padding: 8px; 
            text-align: left; 
            background: #f9f9f9; 
            vertical-align: top; 
        }
        th { 
            background: #eee; 
        }
        .btn-action { 
            font-size: 11px; 
            padding: 3px 6px; 
            cursor: pointer; 
            margin: 1px; 
        }
        .btn-delete { 
            background-color: #ffcccc; 
            color: #cc0000; 
        }
        .button-row { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            margin-top: 5px; 
        }
        .editable { 
            cursor: pointer; 
            border-bottom: 1px dashed #999; 
        }
        .memo-section { 
            border: 1px dashed #bbb; 
            padding: 15px; 
            margin-bottom: 30px; 
            border-radius: 4px; 
        }
        #status-msg { 
            color: #cc0000; 
            font-weight: bold; 
            margin: 10px 0; 
            text-align: center; 
            height: 20px; 
        }
        .file-info-text { 
            font-size: 12px; 
            color: #555; 
            margin-left: 10px; 
        }
        /* 各表の下の操作エリア */
        .table-action-area { 
            padding: 10px; 
            background: #eee; 
            border: 1px solid #ccc; 
            margin-bottom: 30px; 
        }
        .row-selected { background-color: #fff9c4 !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>就活メモ</h1>
        <div id="status-msg"></div>

        <div class="form-section">
            <textarea id="company_name" placeholder="企業名" onfocus="lastFocused=this"></textarea>
            <textarea id="closest_station" placeholder="最寄り駅" onfocus="lastFocused=this"></textarea>
            <textarea id="memo" placeholder="メモ" onfocus="lastFocused=this"></textarea>
            
            <input type="hidden" id="edit_type" value="">
            <input type="hidden" id="edit_index" value="">

            <div class="button-row">
                <select id="link-file-selector" onchange="updateFileInfo('link-file-selector', 'company-info')">
                    <option>-- 企業ファイル選択 --</option>
                </select>
                <span id="company-info" class="file-info-text">選択なし</span>
                <button onclick="insertSelectedTextLink()">🔗 リンク化</button>
                <button class="btn-delete" onclick="deleteFile('link-file-selector')">🗑 削除</button>
            </div>
            
            <div class="button-row">
                <input type="file" id="fileInput" style="display:none" onchange="updateFileNameDisplay(this)">
                <button onclick="document.getElementById('fileInput').click()">ファイル選択</button>
                <span id="file-name-display" style="font-size: 12px; color: #666;">選択されていません</span>
                <button onclick="uploadFile()">📥 アップロード</button>
            </div>
            
            <div class="button-row">
                <select id="table-selector">
                    <option value="kento">検討中の企業</option>
                    <option value="yameta">やめた企業</option>
                    <option value="owatta">終わった企業</option>
                </select>
                <button onclick="handleSubmit()">＋ データを追加/更新</button>
            </div>
        </div>

        <h2>■ 企業リスト</h2>
        <h3>検討中</h3>
        <div class="table-wrapper"><table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
        <div class="table-action-area">
            <select id="ctrl-kento"><option value="owatta">終わったへ</option><option value="yameta">やめたへ</option></select>
            <button onclick="executeAction('kento', 'move')">移動</button>
            <button class="btn-delete" onclick="executeAction('kento', 'delete')">削除</button>
        </div>

        <h3>終わった</h3>
        <div class="table-wrapper"><table id="table-owatta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
        <div class="table-action-area">
            <select id="ctrl-owatta"><option value="kento">検討中へ</option><option value="yameta">やめたへ</option></select>
            <button onclick="executeAction('owatta', 'move')">移動</button>
            <button class="btn-delete" onclick="executeAction('owatta', 'delete')">削除</button>
        </div>

        <h3>やめた</h3>
        <div class="table-wrapper"><table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
        <div class="table-action-area">
            <select id="ctrl-yameta"><option value="kento">検討中へ</option><option value="owatta">終わったへ</option></select>
            <button onclick="executeAction('yameta', 'move')">移動</button>
            <button class="btn-delete" onclick="executeAction('yameta', 'delete')">削除</button>
        </div>

        <div class="memo-section">
            <h3>■ 追記メモ</h3>
            <textarea id="additional_memo" oninput="saveAdditionalMemo()"></textarea>
        </div>
    </div>

    <script>
        var lastFocused = document.getElementById('company_name');
        var selectedItem = { type: null, index: null };

        function updateFileNameDisplay(input) {
            var display = document.getElementById('file-name-display');
            display.innerText = input.files[0] ? input.files[0].name : '選択されていません';
        }

        function showStatus(msg, isError) {
            var el = document.getElementById('status-msg');
            el.style.color = isError ? 'red' : 'green';
            el.innerText = msg;
            setTimeout(function() { el.innerText = ''; }, 3000);
        }

        function updateFileInfo(selectId, infoId) {
            var sel = document.getElementById(selectId);
            var info = document.getElementById(infoId);
            info.innerText = sel.selectedIndex > 0 ? "選択中: " + sel.options[sel.selectedIndex].text : "選択なし";
        }

        function selectRow(type, index, item, element) {
            document.querySelectorAll('tr').forEach(tr => tr.classList.remove('row-selected'));
            element.classList.add('row-selected');
            selectedItem.type = type;
            selectedItem.index = index;

            document.getElementById('company_name').value = item.name;
            document.getElementById('closest_station').value = item.station;
            document.getElementById('memo').value = item.memo;
            document.getElementById('table-selector').value = type;
            document.getElementById('edit_type').value = type;
            document.getElementById('edit_index').value = index;
            showStatus("選択しました");
        }

        function executeAction(type, action) {
            if (selectedItem.type !== type) { alert('この表の行を選択してください'); return; }
            fetch('/api/data').then(function(res) { return res.json(); }).then(function(data) {
                if (action === 'delete') {
                    data[type].splice(selectedItem.index, 1);
                } else {
                    var target = document.getElementById('ctrl-' + type).value;
                    var item = data[type].splice(selectedItem.index, 1)[0];
                    if (!data[target]) data[target] = [];
                    data[target].push(item);
                }
                saveToApi(data);
            });
        }

        function loadAllData() {
            fetch('/api/data')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                document.getElementById('additional_memo').value = data.additional || '';
                var types = ['kento', 'owatta', 'yameta'];
                for (var i = 0; i < types.length; i++) {
                    var type = types[i];
                    var tbody = document.querySelector('#table-' + type + ' tbody');
                    var items = data[type] || [];
                    tbody.innerHTML = '';
                    for (var j = 0; j < items.length; j++) {
                        var item = items[j];
                        var row = document.createElement('tr');
                        row.onclick = (function(t, idx, it, el) { return function() { selectRow(t, idx, it, el); }; })(type, j, item, row);
                        
                        var numCell = document.createElement('td'); numCell.innerText = j + 1; row.appendChild(numCell);
                        var nameCell = document.createElement('td'); nameCell.innerHTML = item.name || ''; row.appendChild(nameCell);
                        var stationCell = document.createElement('td'); stationCell.innerText = item.station || ''; row.appendChild(stationCell);
                        var memoCell = document.createElement('td'); memoCell.innerHTML = item.memo || ''; row.appendChild(memoCell);
                        
                        tbody.appendChild(row);
                    }
                }
                loadCompanyFiles();
            });
        }

        function handleSubmit() {
            fetch('/api/data').then(function(res) { return res.json(); }).then(function(data) {
                var type = document.getElementById('table-selector').value;
                var eType = document.getElementById('edit_type').value;
                var eIdx = document.getElementById('edit_index').value;
                var newItem = { 
                    name: document.getElementById('company_name').value, 
                    station: document.getElementById('closest_station').value, 
                    memo: document.getElementById('memo').value 
                };
                
                if (eType !== "") data[eType].splice(eIdx, 1);
                if (!data[type]) data[type] = [];
                data[type].push(newItem);
                
                saveToApi(data);
                document.getElementById('edit_type').value = "";
                document.getElementById('edit_index').value = "";
            });
        }

        function loadCompanyFiles() {
            fetch('/api/files/company').then(function(res) { return res.json(); }).then(function(files) {
                var sel = document.getElementById('link-file-selector');
                sel.innerHTML = '<option>-- 企業ファイル選択 --</option>';
                files.forEach(function(f) {
                    var opt = document.createElement('option');
                    opt.value = f.url;
                    opt.setAttribute('data-path', f.path);
                    opt.text = f.name;
                    sel.appendChild(opt);
                });
            });
        }

        function uploadFile() {
            var fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return;
            var fd = new FormData();
            fd.append('file', fileInput.files[0]);
            fetch('/api/upload', { method: 'POST', body: fd, headers: {'x-upload-type': 'company'} }).then(function() { loadAllData(); });
        }

        function deleteFile(selId) {
            var sel = document.getElementById(selId);
            if (sel.selectedIndex <= 0) return;
            var path = sel.options[sel.selectedIndex].getAttribute('data-path');
            fetch('/api/delete-file', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: path}) }).then(function() { loadAllData(); });
        }

        function insertSelectedTextLink() {
            var sel = document.getElementById('link-file-selector');
            if (sel.selectedIndex <= 0) { alert('ファイルを選択してください'); return; }
            var ta = lastFocused;
            var start = ta.selectionStart;
            var end = ta.selectionEnd;
            var text = ta.value.substring(start, end) || sel.options[sel.selectedIndex].text;
            ta.value = ta.value.substring(0, start) + '<a href="' + sel.value + '" target="_blank">' + text + '</a>' + ta.value.substring(end);
            ta.focus();
        }

        function saveAdditionalMemo() {
            fetch('/api/data').then(function(res) { return res.json(); }).then(function(data) {
                data.additional = document.getElementById('additional_memo').value;
                saveToApi(data);
            });
        }

        function saveToApi(data) {
            fetch('/api/data', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(data) 
            }).then(function() { loadAllData(); });
        }

        window.onload = loadAllData;
    </script>
</body>
</html>
