<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        .form-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; min-height: 80px; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 30px; }
        table { width: 100%; min-width: 800px; border-collapse: collapse; cursor: pointer; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; background: #f9f9f9; vertical-align: top; }
        th { background: #eee; }
        .text-center { text-align: center !important; display: block; }
        .btn-delete { background-color: #ffcccc; color: #cc0000; padding: 5px 10px; cursor: pointer; border: 1px solid #cc0000; }
        .button-row { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        .memo-section { border: 1px dashed #bbb; padding: 15px; margin-bottom: 30px; border-radius: 4px; }
        #status-msg { color: #cc0000; font-weight: bold; margin: 10px 0; text-align: center; height: 20px; }
        .file-info-text { font-size: 12px; color: #555; margin-left: 10px; }
        .table-action-area { padding: 10px; background: #eee; border: 1px solid #ccc; margin-bottom: 30px; }
        .row-selected { background-color: #fff9c4 !important; }
        .external-links { margin-bottom: 20px; }
        .external-links a { margin-right: 15px; text-decoration: none; color: #0066cc; }
        .doc-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; text-align: center; }
        .doc-section select, .doc-section button { display: block; margin: 10px auto; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; padding: 5px 10px; }
        .btn-delete-doc { color: #cc0000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>就活メモ</h1>
        <div id="status-msg"></div>
        <div class="form-section">
            <textarea id="company_name" placeholder="企業名" onfocus="lastFocused=this"></textarea>
            <textarea id="closest_station" placeholder="最寄り駅" onfocus="lastFocused=this"></textarea>
            <textarea id="memo" placeholder="メモ" onfocus="lastFocused=this"></textarea>
            <input type="hidden" id="edit_type" value="">
            <input type="hidden" id="edit_index" value="">
            <div class="button-row">
                <select id="link-file-selector" onchange="updateFileInfo('link-file-selector', 'company-info')">
                    <option>-- 企業ファイル選択 --</option>
                </select>
                <span id="company-info" class="file-info-text">選択なし</span>
                <button onclick="insertSelectedTextLink()">🔗 リンク化</button>
                <button onclick="applyCenterAlign()">🎯 中央揃え</button>
                <button class="btn-delete" onclick="deleteFile('link-file-selector')">🗑 削除</button>
            </div>
            <div class="button-row">
                <input type="file" id="fileInput" style="display:none" onchange="updateFileNameDisplay(this)">
                <button onclick="document.getElementById('fileInput').click()">ファイル選択</button>
                <span id="file-name-display" style="font-size: 12px; color: #666;">選択されていません</span>
                <button onclick="uploadFile()">📥 アップロード</button>
            </div>
            <div class="button-row">
                <select id="table-selector">
                    <option value="kento">検討中の企業</option>
                    <option value="yameta">やめた企業</option>
                    <option value="owatta">終わった企業</option>
                </select>
                <button onclick="handleSubmit()">＋ データを追加/更新</button>
            </div>
        </div>

        <h2>■ 企業リスト</h2>
        <h3>検討中</h3>
        <div class="table-wrapper"><table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
        <div class="table-action-area">
            <select id="ctrl-kento"><option value="edit">編集モードへ</option><option value="owatta">終わったへ移動</option><option value="yameta">やめたへ移動</option></select>
            <select id="index-kento"><option value="">番号選択</option></select>
            <button onclick="executeAction('kento')">実行</button>
            <button class="btn-delete" onclick="deleteItem('kento')">削除</button>
        </div>
        <h3>終わった</h3>
        <div class="table-wrapper"><table id="table-owatta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
        <div class="table-action-area">
            <select id="index-owatta"><option value="">番号選択</option></select>
            <button class="btn-delete" onclick="deleteItem('owatta')">削除</button>
        </div>
        <h3>やめた</h3>
        <div class="table-wrapper"><table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
        <div class="table-action-area">
            <select id="ctrl-yameta"><option value="edit">編集モードへ</option><option value="kento">検討中へ移動</option><option value="owatta">終わったへ移動</option></select>
            <select id="index-yameta"><option value="">番号選択</option></select>
            <button onclick="executeAction('yameta')">実行</button>
            <button class="btn-delete" onclick="deleteItem('yameta')">削除</button>
        </div>

        <div class="external-links">
            <span class="text-center">
                <a href="https://www.atgp.jp/" target="_blank">atGP</a> 
                <a href="https://www.clover-navi.com/" target="_blank">クローバーナビ</a> 
                <a href="https://doda.jp/challenge/" target="_blank">dodaチャレンジ</a> 
                <a href="https://www.hellowork.mhlw.go.jp/" target="_blank">ハローワーク</a>
            </span>
        </div>
        <div class="memo-section">
            <h3>■ 追記メモ</h3>
            <textarea id="additional_memo" oninput="saveAdditionalMemo()"></textarea>
        </div>
        <div class="doc-section">
            <h3>■ 提出書類 同期</h3>
            <!-- URL登録用UI追加 -->
            <div style="margin-bottom: 10px;">
                <input type="text" id="urlInput" placeholder="URLを入力" style="width: 70%; padding: 5px;">
                <button onclick="saveUrl()" style="display:inline-block;">🔗 URL登録</button>
            </div>
            <button onclick="document.getElementById('docInput').click()">📤 アップロード</button>
            <input type="file" id="docInput" style="display:none" onchange="handleUpload()">
            <select id="doc-selector"><option value="">-- 保存済みファイル/URLを選択 --</option></select>
            <button onclick="downloadDoc()">📥 ダウンロード/表示</button>
            <button class="btn-delete-doc" onclick="deleteDoc()">🗑 削除</button>
        </div>
    </div>

    <script>
        var lastFocused = document.getElementById('company_name');
        
        window.onload = function() {
            loadAllData();
            loadFileList();
        };

        function selectRow(type, index, element) {
            document.querySelectorAll('tr').forEach(tr => tr.classList.remove('row-selected'));
            element.classList.add('row-selected');
        }

        function applyCenterAlign() {
            var ta = lastFocused;
            if(!ta) return;
            var start = ta.selectionStart;
            var end = ta.selectionEnd;
            var s = ta.value.substring(start, end);
            var r = '<span class="text-center">' + (s || "中央揃えするテキストを選択してください") + '</span>';
            ta.value = ta.value.substring(0, start) + r + ta.value.substring(end);
        }

        function loadAllData() {
            fetch('/api/data')
            .then(res => res.json())
            .then(data => {
                document.getElementById('additional_memo').value = data.additional || '';
                ['kento', 'owatta', 'yameta'].forEach(type => {
                    var tbody = document.querySelector('#table-' + type + ' tbody');
                    var sel = document.getElementById('index-' + type);
                    if(!tbody) return;
                    tbody.innerHTML = '';
                    if (sel) sel.innerHTML = '<option value="">番号選択</option>';
                    (data[type] || []).forEach((item, i) => {
                        var row = document.createElement('tr');
                        row.onclick = function() { selectRow(type, i, row); };
                        row.innerHTML = '<td>' + (i + 1) + '</td><td>' + item.name + '</td><td>' + item.station + '</td><td>' + item.memo + '</td>';
                        tbody.appendChild(row);
                        if (sel) {
                            var opt = document.createElement('option');
                            opt.value = i;
                            opt.text = (i + 1) + ": " + item.name.replace(/<[^>]*>?/gm, '');
                            sel.appendChild(opt);
                        }
                    });
                });
                loadCompanyFiles();
            })
            .catch(err => console.error("データ取得エラー:", err));
        }

        function saveToApi(data) {
            fetch('/api/data', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) })
            .then(() => loadAllData());
        }

        function handleSubmit() {
            fetch('/api/data').then(res => res.json()).then(data => {
                var type = document.getElementById('table-selector').value;
                var eType = document.getElementById('edit_type').value;
                var eIdx = document.getElementById('edit_index').value;
                var newItem = { 
                    name: document.getElementById('company_name').value, 
                    station: document.getElementById('closest_station').value, 
                    memo: document.getElementById('memo').value 
                };
                if (eType !== "") { data[eType].splice(eIdx, 1); }
                if (!data[type]) data[type] = [];
                data[type].push(newItem);
                saveToApi(data);
                document.getElementById('company_name').value = "";
                document.getElementById('closest_station').value = "";
                document.getElementById('memo').value = "";
                document.getElementById('edit_type').value = "";
                document.getElementById('edit_index').value = "";
            });
        }

        function executeAction(type) {
            var action = document.getElementById('ctrl-' + type).value;
            var idx = document.getElementById('index-' + type).value;
            if (idx === "") { alert('番号を選択してください'); return; }
            fetch('/api/data').then(res => res.json()).then(data => {
                if (action === 'edit') {
                    var item = data[type][idx];
                    document.getElementById('company_name').value = item.name;
                    document.getElementById('closest_station').value = item.station;
                    document.getElementById('memo').value = item.memo;
                    document.getElementById('table-selector').value = type;
                    document.getElementById('edit_type').value = type;
                    document.getElementById('edit_index').value = idx;
                } else {
                    var item = data[type].splice(idx, 1)[0];
                    if (!data[action]) data[action] = [];
                    data[action].push(item);
                    saveToApi(data);
                }
            });
        }

        function deleteItem(type) {
            var idx = document.getElementById('index-' + type).value;
            if (idx === "") { alert('削除する番号を選択してください'); return; }
            fetch('/api/data').then(res => res.json()).then(data => {
                data[type].splice(idx, 1);
                saveToApi(data);
            });
        }

        function loadCompanyFiles() {
            fetch('/api/files/company').then(res => res.json()).then(files => {
                var sel = document.getElementById('link-file-selector');
                if(!sel) return;
                sel.innerHTML = '<option>-- 企業ファイル選択 --</option>';
                files.forEach(function(f) {
                    var opt = document.createElement('option');
                    opt.value = f.url;
                    opt.text = f.name;
                    sel.appendChild(opt);
                });
            });
        }

        function uploadFile() {
            var fileInput = document.getElementById('fileInput');
            if(!fileInput.files[0]) { alert("ファイルを選択してください"); return; }
            var fd = new FormData();
            fd.append('file', fileInput.files[0]);
            fetch('/api/upload', { method: 'POST', body: fd, headers: {'x-upload-type': 'company'} })
            .then(res => { if (res.ok) { alert("成功"); loadAllData(); } });
        }

        function deleteFile(s) {
            var sel = document.getElementById(s);
            if (sel.selectedIndex <= 0) return;
            fetch('/api/delete-file', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path: '/project/src/PDF/company/' + sel.options[sel.selectedIndex].text }) })
            .then(() => loadAllData());
        }

        function handleUpload() {
            var input = document.getElementById('docInput');
            if (!input.files[0]) return;
            var fd = new FormData();
            fd.append('file', input.files[0]);
            fetch('/api/upload', { method: 'POST', body: fd, headers: {'x-upload-type': 'docs'} })
            .then(res => { if (res.ok) { alert('アップロード完了'); loadFileList(); } });
        }

        function saveUrl() {
            var url = document.getElementById('urlInput').value;
            if (!url) { alert('URLを入力してください'); return; }
            // URLを保存するためのAPIエンドポイントへ送信
            fetch('/api/save-url', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url: url }) 
            })
            .then(res => { if (res.ok) { alert('URLを登録しました'); loadFileList(); } });
        }

        function loadFileList() {
            fetch('/api/files/docs').then(res => res.json()).then(files => {
                var select = document.getElementById('doc-selector');
                if (select) {
                    select.innerHTML = '<option value="">-- 保存済みファイル/URLを選択 --</option>';
                    files.forEach(fileObj => {
                        var opt = document.createElement('option');
                        opt.value = fileObj.name;
                        opt.text = fileObj.name;
                        select.appendChild(opt);
                    });
                }
            });
        }

        function downloadDoc() {
            var select = document.getElementById('doc-selector');
            var val = select.value;
            if (!val) { alert('ファイル/URLを選択してください'); return; }
            
            // http/httpsで始まれば新しいタブで開く、そうでなければダウンロードする
            if (val.startsWith('http')) {
                window.open(val, '_blank');
            } else {
                window.location.href = window.location.origin + '/data/documents/' + encodeURIComponent(val);
            }
        }

        function deleteDoc() {
            var select = document.getElementById('doc-selector');
            var name = select.value;
            if (!name || !confirm(name + ' を削除しますか？')) return;
            fetch('/api/delete-file', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path: '/project/src/PDF/documents/' + name }) })
            .then(res => { if (res.ok) { alert('削除しました'); loadFileList(); } });
        }

        function updateFileNameDisplay(input) {
            document.getElementById('file-name-display').innerText = input.files[0] ? input.files[0].name : '選択されていません';
        }

        function updateFileInfo(s, i) {
            var sel = document.getElementById(s);
            document.getElementById(i).innerText = sel.selectedIndex > 0 ? "選択中: " + sel.options[sel.selectedIndex].text : "選択なし";
        }

        function insertSelectedTextLink() {
            var sel = document.getElementById('link-file-selector');
            if(sel.selectedIndex <= 0) return;
            var ta = lastFocused;
            var s = ta.selectionStart, e = ta.selectionEnd;
            var txt = ta.value.substring(s, e) || sel.options[sel.selectedIndex].text;
            ta.value = ta.value.substring(0, s) + '<a href="' + sel.value + '" target="_blank">' + txt + '</a>' + ta.value.substring(e);
        }

        function saveAdditionalMemo() {
            fetch('/api/data').then(res => res.json()).then(data => {
                data.additional = document.getElementById('additional_memo').value;
                saveToApi(data);
            });
        }
    </script>
</body>
</html>
