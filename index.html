    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';

        // 共通のリンク挿入処理
        function insertLink() {
            const activeElement = document.activeElement;
            const url = document.getElementById('urlInput').value;
            if (!url) { alert('URLを入力するか、PDFをアップロードしてください'); return; }
            if (activeElement.tagName !== 'TEXTAREA') { alert('テキストエリア内を選択してください'); return; }

            const start = activeElement.selectionStart;
            const end = activeElement.selectionEnd;
            const selectedText = activeElement.value.substring(start, end);
            
            if (selectedText) {
                const newText = `[${selectedText}](${url})`;
                activeElement.value = activeElement.value.substring(0, start) + newText + activeElement.value.substring(end);
            } else {
                alert('リンク化したい文字を範囲選択してください。');
            }
        }

        async function handleFileUpload() {
            const fileInput = document.getElementById('pdfUpload');
            if (!fileInput.files[0]) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            const res = await fetch(`${API_URL}/api/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('urlInput').value = data.url;
        }
