<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        .form-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; min-height: 50px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <h1>就活メモ</h1>
    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table>

    <div class="form-section">
        <h3>■ 追記メモ</h3>
        <textarea id="additional_memo" placeholder="ここに自由記述のメモを記載"></textarea>
    </div>
</div>

<script>
    const API_URL = ''; // 同じサーバー内なので空でOK

    // 追記メモの同期処理
    async function loadMemo() {
        const res = await fetch('/api/memo');
        const data = await res.json();
        document.getElementById('additional_memo').value = data.content || '';
    }

    document.getElementById('additional_memo').addEventListener('input', async (e) => {
        await fetch('/api/memo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ content: e.target.value })
        });
    });

    // 既存のテーブル追加処理（元のコードをここに復元してください）
    function handleSubmit() {
        const name = document.getElementById('company_name').value;
        const station = document.getElementById('closest_station').value;
        const memo = document.getElementById('memo').value;
        const tbody = document.querySelector('#table-kento tbody');
        tbody.innerHTML += `<tr><td>${name}</td><td>${station}</td><td>${memo}</td></tr>`;
    }

    loadMemo();
</script>
</body>
</html>
