<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #f4f4f4; }
        textarea { width: 100%; box-sizing: border-box; }
        .area-box { border: 1px solid #999; padding: 10px; margin-bottom: 20px; background: #f9f9f9; }
    </style>
</head>
<body>

    <h1>就活メモ</h1>

    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ（改行OK）"></textarea>
        
        <div style="background: #f0f0f0; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc;">
            <input type="text" id="urlInput" placeholder="ここにURLを入力" style="width: 60%;">
            <br>
            <input type="file" id="pdfUpload">
            <button onclick="handleFileUpload()">📤 PDFをアップロードしてURL取得</button>
            <br>
            <button onclick="insertLink()" style="margin-top: 5px; font-weight: bold;">選択テキストをリンク化（URLとセット）</button>
        </div>

        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';

        function parseMarkdownLinks(text) {
            if (!text) return "";
            return text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>').replace(/\n/g, '<br>');
        }

        // 共通のリンク挿入処理
        function insertLink() {
            const activeElement = document.activeElement;
            const url = document.getElementById('urlInput').value;
            
            if (!url) { alert('先にURLを入力するか、PDFをアップロードしてください'); return; }
            if (activeElement.tagName !== 'TEXTAREA') { alert('テキストエリア内を選択してください'); return; }

            const start = activeElement.selectionStart;
            const end = activeElement.selectionEnd;
            const selectedText = activeElement.value.substring(start, end);
            
            if (selectedText) {
                const newText = `[${selectedText}](${url})`;
                activeElement.value = activeElement.value.substring(0, start) + newText + activeElement.value.substring(end);
            } else {
                alert('リンク化したい文字を範囲選択してください。');
            }
        }

        async function handleFileUpload() {
            const fileInput = document.getElementById('pdfUpload');
            if (!fileInput.files[0]) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            const res = await fetch(`${API_URL}/api/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('urlInput').value = data.url; // URL欄に自動入力
        }

        // ... その他の関数（loadJobs, handleSubmit等）はそのまま
    </script>
</body>
</html>
