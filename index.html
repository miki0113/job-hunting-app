<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .external-links { margin-bottom: 20px; }
        .memo-box { border: 1px dashed #999; padding: 10px; margin-bottom: 20px; }
        textarea { width: 100%; box-sizing: border-box; }
        button { margin: 2px; }
    </style>
</head>
<body>

    <h1>就活メモ</h1>

    <div class="form-section">
        <input type="text" id="company_name" placeholder="企業名">
        <input type="text" id="closest_station" placeholder="最寄り駅">
        <textarea id="memo" placeholder="メモ（改行して入力可）"></textarea>
        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <h2>■ 終わった企業</h2>
    <table id="table-owari"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <h2>■ やめた企業</h2>
    <table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>移動</th><th>操作</th></tr></thead><tbody></tbody></table>

    <div class="external-links">
        <a href="https://www.atgp.jp/" target="_blank">atGP</a> | 
        <a href="https://clover-navi.jp/" target="_blank">クローバーナビ</a> | 
        <a href="https://doda.jp/" target="_blank">dodaチャレンジ</a> | 
        <a href="https://www.hellowork.mhlw.go.jp/" target="_blank">ハローワーク</a>
    </div>

    <div class="memo-box">
        <h2>■ 追記メモ</h2>
        <p>・履歴書の添削依頼をスタッフさんに提出済み(4/23)<br>
           ・今回のリストに関しては見つけたものを並べただけであり優先順位を付けたものではない<br>
           ・なるべくは実習や見学に行ける求人が望ましい</p>
    </div>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';

        async function loadJobs() {
            const res = await fetch(`${API_URL}/api/jobs`);
            const jobs = await res.json();
            
            ['table-kento', 'table-owari', 'table-yameta'].forEach(id => {
                document.querySelector(`#${id} tbody`).innerHTML = '';
            });

            jobs.forEach(job => {
                const targetId = job.status === '終わった企業' ? 'table-owari' : 
                                 job.status === 'やめた企業' ? 'table-yameta' : 'table-kento';
                const tbody = document.querySelector(`#${targetId} tbody`);
                const memoHtml = (job.memo || '').split('\n').map(line => {
                    return line.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
                }).join('<br>');

                // 移動ボタンを生成（ステータスに応じて移動先を表示）
                let moveButtons = '';
                if (job.status !== '検討中の企業') moveButtons += `<button onclick="moveJob(${job.id}, '検討中の企業')">検討</button>`;
                if (job.status !== '終わった企業') moveButtons += `<button onclick="moveJob(${job.id}, '終わった企業')">終了</button>`;
                if (job.status !== 'やめた企業') moveButtons += `<button onclick="moveJob(${job.id}, 'やめた企業')">中止</button>`;

                tbody.innerHTML += `<tr><td>${job.id}</td><td>${job.company_name}</td><td>${job.closest_station}</td><td>${memoHtml}</td><td>${moveButtons}</td><td><button onclick="deleteJob(${job.id})">削除</button></td></tr>`;
            });
        }

        // ステータスを更新する関数
        async function moveJob(id, newStatus) {
            await fetch(`${API_URL}/api/jobs/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            loadJobs();
        }

        async function handleSubmit() {
            const data = {
                company_name: document.getElementById('company_name').value,
                closest_station: document.getElementById('closest_station').value,
                memo: document.getElementById('memo').value,
                status: document.getElementById('status_select').value
            };
            const res = await fetch(`${API_URL}/api/jobs`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) loadJobs();
        }

        async function deleteJob(id) {
            await fetch(`${API_URL}/api/jobs/${id}`, { method: 'DELETE' });
            loadJobs();
        }
        loadJobs();
    </script>
</body>
</html>
