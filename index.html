<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        .form-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; min-height: 50px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; background: #f9f9f9; }
        th { background: #eee; }
        /* 同期エリア用の縦配置スタイル */
        .sync-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>就活メモ</h1>
    
    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        
        <div>
            <input type="file" id="topFile" style="display:none" onchange="document.getElementById('file-name').textContent = this.files[0].name">
            <button onclick="document.getElementById('topFile').click()">ファイルの選択</button>
            <button onclick="uploadTopFile()">📤 アップロード</button>
            <span id="file-name"></span>
            <button onclick="insertTopLink()">選択テキストをリンク化</button>
        </div>
        
        <select id="table-selector" style="margin-top: 10px;">
            <option value="kento">検討中の企業</option>
            <option value="yameta">やめた企業</option>
            <option value="owatta">終わった企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table>

    <h2>■ やめた企業</h2>
    <table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table>

    <h2>■ 終わった企業</h2>
    <table id="table-owatta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table>

    <div class="form-section">
        <h3>■ 追記メモ</h3>
        <textarea id="additional_memo"></textarea>
    </div>

    <div class="form-section sync-section">
        <h3>■ 提出書類 同期（履歴書・職務経歴書など全形式対応）</h3>
        <button onclick="document.getElementById('topFile').click()">📤 アップロード</button>
        <select id="file-select" style="width: 250px;"></select>
        <button onclick="downloadFile()">⬇️ ダウンロード/表示</button>
        <button onclick="deleteFile()" style="color:red">🗑️ 削除</button>
    </div>
</div>

<script>
    let topUploadedUrl = "";
    async function updateFileList() {
        const res = await fetch('/api/files');
        const files = await res.json();
        const select = document.getElementById('file-select');
        select.innerHTML = files.map(f => `<option value="${f}">${f}</option>`).join('');
    }
    async function uploadTopFile() {
        const fileInput = document.getElementById('topFile');
        if (!fileInput.files[0]) return alert('ファイル未選択');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        topUploadedUrl = data.url;
        updateFileList();
        alert('アップロード完了');
    }
    function downloadFile() {
        const file = document.getElementById('file-select').value;
        if (file) window.open('/uploads/' + file, '_blank');
    }
    async function deleteFile() {
        const file = document.getElementById('file-select').value;
        if (!file || !confirm('削除しますか？')) return;
        await fetch('/api/upload/' + file, { method: 'DELETE' });
        updateFileList();
    }
    function insertTopLink() {
        if (!topUploadedUrl) return alert('先にアップロードしてください');
        const ta = document.getElementById('memo');
        const start = ta.selectionStart, end = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + `<a href="${topUploadedUrl}" target="_blank">${ta.value.substring(start, end) || 'リンク'}</a>` + ta.value.substring(end);
    }
    function handleSubmit() {
        const target = document.getElementById('table-selector').value;
        const tbody = document.querySelector(`#table-${target} tbody`);
        tbody.innerHTML += `<tr><td>New</td><td>${document.getElementById('company_name').value}</td><td>${document.getElementById('closest_station').value}</td><td>${document.getElementById('memo').value}</td></tr>`;
    }
    async function loadMemo() {
