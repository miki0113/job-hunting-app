<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        .form-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; min-height: 50px; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 30px; }
        table { width: 100%; min-width: 600px; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; background: #f9f9f9; }
        th { background: #eee; }
        .button-row { display: flex; align-items: center; gap: 2px; margin-top: 5px; margin-bottom: 0px; }
        .sync-section { border: 1px solid #ccc; padding: 25px; margin-bottom: 20px; text-align: center; }
        .sync-buttons { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>就活メモ</h1>
    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        <div class="button-row">
            <button onclick="document.getElementById('topFile').click()">ファイルの選択</button>
            <input type="file" id="topFile" style="display:none" onchange="document.getElementById('file-name').textContent = this.files[0].name">
            <button onclick="uploadTopFile()">📥 アップロード</button>
            <span id="file-name"></span>
            <button onclick="insertSelectedTextLink()">選択テキストをリンク化</button>
        </div>
        <div class="button-row">
            <select id="table-selector">
                <option value="kento">検討中の企業</option>
                <option value="yameta">やめた企業</option>
                <option value="owatta">終わった企業</option>
            </select>
            <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
        </div>
    </div>
    <h2>■ 検討中の企業</h2>
    <div class="table-wrapper"><table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
    <h2>■ 終わった企業</h2>
    <div class="table-wrapper"><table id="table-owatta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
    <h2>■ やめた企業</h2>
    <div class="table-wrapper"><table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th></tr></thead><tbody></tbody></table></div>
    <div class="form-section">
        <h3>■ 追記メモ</h3>
        <textarea id="additional_memo"></textarea>
    </div>
    <div class="sync-section">
        <h3>■ 提出書類 同期</h3>
        <div class="sync-buttons">
            <input type="file" id="syncFile" style="display:none" onchange="uploadSyncFile()">
            <button onclick="document.getElementById('syncFile').click()">📥 ファイルをアップロードして同期</button>
            <select id="file-select"><option value="">-- 同期済みファイルを選択 --</option></select>
            <button onclick="downloadFile()">📤 ダウンロード/表示</button>
            <button onclick="deleteFile()" style="color:red">🗑️ 削除</button>
        </div>
    </div>
</div>
<script>
    let lastUploadedUrl = "";
    // ディスク内のフォルダ分け定義（サーバー側APIでこのパスを使い分ける）
    const PATH_DATA = '/project/src/PDF/data/'; // テーブル・メモ用
    const PATH_SYNC = '/project/src/PDF/sync/'; // 同期ファイル用

    async function loadAllData() {
        const res = await fetch('/api/data');
        const data = await res.json();
        document.getElementById('additional_memo').value = data.memo || '';
        ['kento', 'owatta', 'yameta'].forEach(type => {
            const tbody = document.querySelector(`#table-${type} tbody`);
            tbody.innerHTML = (data[type] || []).map((item, i) => 
                `<tr><td>${i+1}</td><td>${item.name}</td><td>${item.station}</td><td>${item.memo}</td></tr>`).join('');
        });
        updateSyncFileList();
    }

    async function saveData() {
        const data = {
            memo: document.getElementById('additional_memo').value,
            kento: getTableData('kento'), owatta: getTableData('owatta'), yameta: getTableData('yameta')
        };
        await fetch('/api/data', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
    }

    function getTableData(type) {
        return Array.from(document.querySelectorAll(`#table-${type} tbody tr`)).map(tr => ({
            name: tr.cells[1].textContent, station: tr.cells[2].textContent, memo: tr.cells[3].textContent
        }));
    }

    function handleSubmit() {
        const t = document.getElementById('table-selector').value;
        const tbody = document.querySelector(`#table-${t} tbody`);
        tbody.innerHTML += `<tr><td>${tbody.rows.length+1}</td><td>${document.getElementById('company_name').value}</td><td>${document.getElementById('closest_station').value}</td><td>${document.getElementById('memo').value}</td></tr>`;
        saveData();
    }

    async function uploadTopFile() {
        const f = document.getElementById('topFile').files[0];
        if (!f) return;
        const fd = new FormData(); fd.append('file', f);
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const d = await res.json();
        lastUploadedUrl = d.url;
    }

    async function uploadSyncFile() {
        const f = document.getElementById('syncFile').files[0];
        if (!f) return;
        const fd = new FormData(); fd.append('file', f);
        // サーバー側で /project/src/PDF/sync/ に保存するようエンドポイントを調整してください
        await fetch('/api/upload-sync', { method: 'POST', body: fd });
        updateSyncFileList();
    }

    async function updateSyncFileList() {
        const res = await fetch('/api/files-sync');
        const files = await res.json();
        const sel = document.getElementById('file-select');
        sel.innerHTML = '<option value="">-- 同期済みファイルを選択 --</option>' + files.map(f => `<option value="${f}">${f}</option>`).join('');
    }

    function insertSelectedTextLink() {
        if (!lastUploadedUrl) return alert('先に上部の「ファイルの選択」からアップロードしてください');
        const ta = document.getElementById('memo');
        ta.value += `<a href="${lastUploadedUrl}" target="_blank">書類リンク</a>`;
        saveData();
    }

    function downloadFile() {
        const file = document.getElementById('file-select').value;
        if (file) window.open('/sync/' + file, '_blank');
    }

    async function deleteFile() {
        const file = document.getElementById('file-select').value;
        if (file && confirm('削除しますか？')) {
            await fetch('/api/upload-sync/' + file, { method: 'DELETE' });
            updateSyncFileList();
        }
    }
    document.getElementById('additional_memo').addEventListener('input', saveData);
    loadAllData();
</script>
</body>
</html>
