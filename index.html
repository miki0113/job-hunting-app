<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-section { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="form-section">
        <input type="text" id="company_name" placeholder="企業名">
        <input type="text" id="closest_station" placeholder="最寄り">
        <input type="text" id="memo" placeholder="メモ">
        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">保存</button>
    </div>
    <table><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody id="table-body"></tbody></table>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';
        
        async function loadJobs() {
            const res = await fetch(`${API_URL}/api/jobs`);
            const jobs = await res.json();
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            jobs.forEach(job => {
                tbody.innerHTML += `<tr><td>${job.id}</td><td>${job.company_name}</td><td>${job.closest_station}</td><td>${job.memo}</td>
                <td><button onclick="deleteJob('${job.id}')">削除</button></td></tr>`;
            });
        }

        async function handleSubmit() {
            const data = {
                company_name: document.getElementById('company_name').value,
                closest_station: document.getElementById('closest_station').value,
                memo: document.getElementById('memo').value,
                status: document.getElementById('status_select').value
            };
            const res = await fetch(`${API_URL}/api/jobs`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) { loadJobs(); } else { alert('保存失敗'); }
        }

        async function deleteJob(id) {
            await fetch(`${API_URL}/api/jobs/${id}`, { method: 'DELETE' });
            loadJobs();
        }
        loadJobs();
    </script>
</body>
</html>
