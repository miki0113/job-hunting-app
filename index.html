<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        .form-section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 5px;
            min-height: 80px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            background: #f9f9f9;
            vertical-align: top;
        }

        th {
            background: #eee;
        }

        .btn-action {
            font-size: 11px;
            padding: 3px 6px;
            cursor: pointer;
            margin: 1px;
        }

        .btn-delete {
            background-color: #ffcccc;
            color: #cc0000;
        }

        .button-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }

        .editable {
            cursor: pointer;
            border-bottom: 1px dashed #999;
        }

        .memo-section {
            border: 1px dashed #bbb;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        #status-msg {
            color: #cc0000;
            font-weight: bold;
            margin: 10px 0;
            text-align: center;
            height: 20px;
        }

        .file-info-text {
            font-size: 12px;
            color: #555;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>就活メモ</h1>
        <div id="status-msg"></div>

        <div class="form-section">
            <textarea id="company_name" placeholder="企業名" onfocus="lastFocused=this"></textarea>
            <textarea id="closest_station" placeholder="最寄り駅" onfocus="lastFocused=this"></textarea>
            <textarea id="memo" placeholder="メモ" onfocus="lastFocused=this"></textarea>
            
            <div class="button-row">
                <select id="link-file-selector" onchange="updateFileInfo('link-file-selector', 'company-info')">
                    <option>-- 企業ファイル選択 --</option>
                </select>
                <span id="company-info" class="file-info-text">選択なし</span>
                <button onclick="insertSelectedTextLink()">🔗 リンク化</button>
                <button class="btn-delete" onclick="deleteFile('link-file-selector')">🗑 削除</button>
            </div>
            
            <div class="button-row">
                <input type="file" id="fileInput" style="display:none">
                <button onclick="document.getElementById('fileInput').click()">ファイル選択</button>
                <button onclick="uploadFile()">📥 アップロード</button>
            </div>
            
            <div class="button-row">
                <select id="table-selector">
                    <option value="kento">検討中の企業</option>
                    <option value="yameta">やめた企業</option>
                    <option value="owatta">終わった企業</option>
                </select>
                <button onclick="handleSubmit()">＋ データを追加</button>
            </div>
        </div>

        <h2>■ 企業リスト</h2>
        
        <h3>検討中</h3>
        <div class="table-wrapper">
            <table id="table-kento">
                <thead>
                    <tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <h3>終わった</h3>
        <div class="table-wrapper">
            <table id="table-owatta">
                <thead>
                    <tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <h3>やめた</h3>
        <div class="table-wrapper">
            <table id="table-yameta">
                <thead>
                    <tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="memo-section">
            <h3>■ 追記メモ</h3>
            <textarea id="additional_memo" oninput="saveAdditionalMemo()"></textarea>
        </div>
    </div>

    <script>
        let lastFocused = document.getElementById('company_name');

        function showStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.style.color = isError ? 'red' : 'green';
            el.innerText = msg;
            setTimeout(() => { el.innerText = ''; }, 3000);
        }

        function updateFileInfo(selectId, infoId) {
            const sel = document.getElementById(selectId);
            const info = document.getElementById(infoId);
            
            if (sel.selectedIndex > 0) {
                info.innerText = "選択中: " + sel.options[sel.selectedIndex].text;
            } else {
                info.innerText = "選択なし";
            }
        }

        async function loadAllData() {
            const res = await fetch('/api/data');
            const data = await res.json();
            
            const getSafeData = (key) => {
                if (data[key]) {
                    return data[key];
                }
                const foundKey = Object.keys(data).find(k => k.includes(key));
                if (foundKey) {
                    return data[foundKey];
                }
                return [];
            };

            document.getElementById('additional_memo').value = data.additional || '';
            
            const types = ['kento', 'owatta', 'yameta'];
            
            for (const type of types) {
                const tbody = document.querySelector('#table-' + type + ' tbody');
                const items = getSafeData(type);
                
                tbody.innerHTML = '';
                
                items.forEach((item, i) => {
                    const row = document.createElement('tr');
                    
                    const numCell = document.createElement('td');
                    numCell.innerText = i + 1;
                    row.appendChild(numCell);
                    
                    const nameCell = document.createElement('td');
                    nameCell.className = 'editable';
                    nameCell.innerText = item.name || '';
                    nameCell.onclick = function() { editCell(type, i, 'name'); };
                    row.appendChild(nameCell);
                    
                    const stationCell = document.createElement('td');
                    stationCell.className = 'editable';
                    stationCell.innerText = item.station || '';
                    stationCell.onclick = function() { editCell(type, i, 'station'); };
                    row.appendChild(stationCell);
                    
                    const memoCell = document.createElement('td');
                    memoCell.className = 'editable';
                    memoCell.innerText = item.memo || '';
                    memoCell.onclick = function() { editCell(type, i, 'memo'); };
                    row.appendChild(memoCell);
                    
                    const actionCell = document.createElement('td');
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-action btn-delete';
                    delBtn.innerText = '削除';
                    delBtn.onclick = function() { deleteItem(type, i); };
                    actionCell.appendChild(delBtn);
                    
                    if (type === 'kento') {
                        const endBtn = document.createElement('button');
                        endBtn.className = 'btn-action';
                        endBtn.innerText = '終';
                        endBtn.onclick = function() { moveItem('kento', i, 'owatta'); };
                        actionCell.appendChild(endBtn);
                        
                        const stopBtn = document.createElement('button');
                        stopBtn.className = 'btn-action';
                        stopBtn.innerText = '止';
                        stopBtn.onclick = function() { moveItem('kento', i, 'yameta'); };
                        actionCell.appendChild(stopBtn);
                    }
                    
                    if (type === 'yameta') {
                        const reviveBtn = document.createElement('button');
                        reviveBtn.className = 'btn-action';
                        reviveBtn.innerText = '検';
                        reviveBtn.onclick = function() { moveItem('yameta', i, 'kento'); };
                        actionCell.appendChild(reviveBtn);
                    }
                    
                    row.appendChild(actionCell);
                    tbody.appendChild(row);
                });
            }
            
            loadCompanyFiles();
        }

        async function loadCompanyFiles() {
            const res = await fetch('/api/files/company');
            const files = await res.json();
            const sel = document.getElementById('link-file-selector');
            
            sel.innerHTML = '<option>-- 企業ファイル選択 --</option>';
            
            files.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.url;
                opt.setAttribute('data-path', f.path);
                opt.text = f.name;
                sel.appendChild(opt);
            });
            
            updateFileInfo('link-file-selector', 'company-info');
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showStatus('ファイルを選択してください', true);
                return;
            }
            
            const fd = new FormData();
            fd.append('file', file);
            
            const res = await fetch('/api/upload', {
                method: 'POST',
                body: fd,
                headers: {'x-upload-type': 'company'}
            });
            
            if (res.ok) {
                showStatus('アップロード成功');
                loadAllData();
            }
        }

        async function deleteFile(selId) {
            const sel = document.getElementById(selId);
            const path = sel.options[sel.selectedIndex]?.getAttribute('data-path');
            
            if (!path || !confirm('削除しますか？')) {
                return;
            }
            
            const res = await fetch('/api/delete-file', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({path: path})
            });
            
            if (res.ok) {
                showStatus('削除成功');
                loadAllData();
            }
        }

        function insertSelectedTextLink() {
            const sel = document.getElementById('link-file-selector');
            
            if (!sel.value || sel.value.includes('--')) {
                showStatus('ファイルを選択してください', true);
                return;
            }
            
            const ta = lastFocused;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const text = ta.value.substring(start, end) || sel.options[sel.selectedIndex].text;
            
            ta.value = ta.value.substring(0, start) + '<a href="' + sel.value + '" target="_blank">' + text + '</a>' + ta.value.substring(end);
            ta.focus();
        }

        async function handleSubmit() {
            const res = await fetch('/api/data');
            const data = await res.json();
            const type = document.getElementById('table-selector').value;
            
            if (!data[type]) {
                data[type] = [];
            }
            
            data[type].push({ 
                name: document.getElementById('company_name').value, 
                station: document.getElementById('closest_station').value, 
                memo: document.getElementById('memo').value 
            });
            
            await saveToApi(data);
            loadAllData();
        }

        async function editCell(t, i, f) {
            const res = await fetch('/api/data');
            const data = await res.json();
            const newVal = prompt("内容:", data[t][i][f]);
            
            if (newVal === null) {
                return;
            }
            
            data[t][i][f] = newVal;
            await saveToApi(data);
            loadAllData();
        }

        async function deleteItem(t, i) {
            if (!confirm('削除しますか？')) {
                return;
            }
            
            const res = await fetch('/api/data');
            const data = await res.json();
            
            data[t].splice(i, 1);
            await saveToApi(data);
            loadAllData();
        }

        async function moveItem(f, i, t) {
            const res = await fetch('/api/data');
            const data = await res.json();
            const item = data[f].splice(i, 1)[0];
            
            if (!data[t]) {
                data[t] = [];
            }
            
            data[t].push(item);
            await saveToApi(data);
            loadAllData();
        }

        async function saveAdditionalMemo() {
            const res = await fetch('/api/data');
            const data = await res.json();
            
            data.additional = document.getElementById('additional_memo').value;
            await saveToApi(data);
        }

        async function saveToApi(data) {
            await fetch('/api/data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
        }

        window.onload = loadAllData;
    </script>
</body>
</html>
