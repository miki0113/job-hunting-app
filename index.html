<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        .area-box { border: 1px solid #999; padding: 10px; margin-bottom: 20px; background: #f9f9f9; }
    </style>
</head>
<body>

    <h1>就活メモ</h1>

    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ"></textarea>
        
        <input type="file" id="topFile"><br>
        <button onclick="uploadTopFile()">📤 アップロード</button><br>
        <button onclick="insertTopLink()">選択テキストをリンク化</button><br>

        <select id="status_select">
            <option value="検討中の企業">検討中の企業</option>
            <option value="終わった企業">終わった企業</option>
            <option value="やめた企業">やめた企業</option>
        </select>
        <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
    </div>

    <h2>■ 検討中の企業</h2>
    <table id="table-kento"><thead><tr><th>ID</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table>

    <script>
        const API_URL = 'https://job-hunting-app-vy3h.onrender.com';
        let topUploadedUrl = "";

        async function uploadTopFile() {
            const fileInput = document.getElementById('topFile');
            if (!fileInput.files[0]) return alert('ファイルを選択してください');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            const res = await fetch(`${API_URL}/api/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            topUploadedUrl = data.url;
            alert('アップロード完了！');
        }

        function insertTopLink() {
            if (!topUploadedUrl) return alert('先にPDFをアップロードしてください');
            const memo = document.getElementById('memo');
            const start = memo.selectionStart;
            const end = memo.selectionEnd;
            const text = memo.value.substring(start, end);
            if (text) {
                memo.value = memo.value.substring(0, start) + `[${text}](${API_URL}${topUploadedUrl})` + memo.value.substring(end);
            }
        }

        async function loadJobs() {
            const res = await fetch(`${API_URL}/api/jobs`);
            const jobs = await res.json();
            const tbody = document.querySelector('#table-kento tbody');
            tbody.innerHTML = '';
            jobs.forEach(j => {
                tbody.innerHTML += `<tr><td>${j.id}</td><td>${j.company_name}</td><td>${j.closest_station}</td><td>${j.memo}</td><td><button onclick="deleteJob(${j.id})">削除</button></td></tr>`;
            });
        }

        async function handleSubmit() {
            const data = { 
                company_name: document.getElementById('company_name').value, 
                closest_station: document.getElementById('closest_station').value, 
                memo: document.getElementById('memo').value, 
                status: document.getElementById('status_select').value 
            };
            await fetch(`${API_URL}/api/jobs`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            loadJobs();
        }

        async function deleteJob(id) {
            await fetch(`${API_URL}/api/jobs/${id}`, { method: 'DELETE' });
            loadJobs();
        }

        loadJobs();
    </script>
</body>
</html>
