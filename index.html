<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>就活メモ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        .form-section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 5px; min-height: 80px; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 30px; }
        table { width: 100%; min-width: 800px; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; background: #f9f9f9; }
        th { background: #eee; }
        .btn-action { font-size: 11px; padding: 3px 6px; cursor: pointer; margin: 1px; }
        .btn-delete { background-color: #ffcccc; color: #cc0000; }
        .button-row { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        #message-display { height: 20px; margin-top: 10px; color: red; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>就活メモ</h1>
    <div class="form-section">
        <textarea id="company_name" placeholder="企業名"></textarea>
        <textarea id="closest_station" placeholder="最寄り駅"></textarea>
        <textarea id="memo" placeholder="メモ（文字を選択してボタンでリンク化）"></textarea>
        <div class="button-row">
            <button onclick="document.getElementById('topFile').click()">ファイルの選択</button>
            <input type="file" id="topFile" style="display:none" onchange="document.getElementById('file-name').textContent = this.files[0].name">
            <button onclick="uploadTopFile()">📥 アップロード</button>
            <span id="file-name"></span>
            <button onclick="insertSelectedTextLink()">🔗 選択テキストをリンク化</button>
        </div>
        <div class="button-row">
            <select id="table-selector">
                <option value="kento">検討中の企業</option>
                <option value="yameta">やめた企業</option>
                <option value="owatta">終わった企業</option>
            </select>
            <button onclick="handleSubmit()">＋ データをテーブルに追加</button>
        </div>
    </div>

    <h2>■ 企業リスト</h2>
    <h3>検討中</h3>
    <div class="table-wrapper"><table id="table-kento"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table></div>
    <h3>終わった</h3>
    <div class="table-wrapper"><table id="table-owatta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table></div>
    <h3>やめた</h3>
    <div class="table-wrapper"><table id="table-yameta"><thead><tr><th>番号</th><th>企業名</th><th>最寄り</th><th>メモ</th><th>操作</th></tr></thead><tbody></tbody></table></div>

    <div class="form-section">
        <h3>■ 追記メモ</h3>
        <textarea id="additional_memo"></textarea>
    </div>
</div>
<script>
    let lastUploadedUrl = "";
    let isDataLoaded = false;
    let allData = { kento: [], owatta: [], yameta: [] };

    async function loadAllData() {
        try {
            const res = await fetch('/api/data');
            const data = await res.json();
            allData = { kento: data.kento || [], owatta: data.owatta || [], yameta: data.yameta || [] };
            document.getElementById('additional_memo').value = data.memo || '';
            renderTables();
            isDataLoaded = true;
        } catch (e) { isDataLoaded = true; }
    }

    function renderTables() {
        ['kento', 'owatta', 'yameta'].forEach(type => {
            const tbody = document.querySelector(`#table-${type} tbody`);
            tbody.innerHTML = allData[type].map((item, i) => `
                <tr>
                    <td>${i+1}</td><td>${item.name}</td><td>${item.station}</td>
                    <td>${item.memo}</td>
                    <td>
                        <button class="btn-action btn-delete" onclick="deleteItem('${type}', ${i})">削除</button>
                        ${type !== 'kento' ? `<button class="btn-action" onclick="moveItem('${type}', ${i}, 'kento')">検討へ</button>` : ''}
                        ${type !== 'owatta' ? `<button class="btn-action" onclick="moveItem('${type}', ${i}, 'owatta')">終わったへ</button>` : ''}
                        ${type !== 'yameta' ? `<button class="btn-action" onclick="moveItem('${type}', ${i}, 'yameta')">やめたへ</button>` : ''}
                    </td>
                </tr>`).join('');
        });
    }

    function deleteItem(type, index) {
        if (!confirm('削除しますか？')) return;
        allData[type].splice(index, 1);
        renderTables();
        saveData();
    }

    function moveItem(fromType, index, toType) {
        const item = allData[fromType].splice(index, 1)[0];
        allData[toType].push(item);
        renderTables();
        saveData();
    }

    function insertSelectedTextLink() {
        if (!lastUploadedUrl) return alert('先にファイルをアップロードしてください');
        const ta = document.getElementById('memo');
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const text = ta.value;
        const selected = text.substring(start, end) || "書類リンク";
        const link = `<a href="${lastUploadedUrl}" target="_blank">${selected}</a>`;
        ta.value = text.substring(0, start) + link + text.substring(end);
    }

    function handleSubmit() {
        const t = document.getElementById('table-selector').value;
        allData[t].push({
            name: document.getElementById('company_name').value,
            station: document.getElementById('closest_station').value,
            memo: document.getElementById('memo').value.replace(/\n/g, '<br>')
        });
        renderTables();
        saveData();
    }

    async function saveData() {
        if (!isDataLoaded) return;
        const data = { memo: document.getElementById('additional_memo').value, ...allData };
        await fetch('/api/data', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
    }

    async function uploadTopFile() {
        const f = document.getElementById('topFile').files[0];
        if (!f) return;
        const fd = new FormData(); fd.append('file', f);
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const d = await res.json();
        lastUploadedUrl = d.url;
        document.getElementById('file-name').textContent = "完了: " + f.name;
    }

    document.getElementById('additional_memo').addEventListener('input', saveData);
    loadAllData();
</script>
</body>
</html>
